services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: veribrand-ai:latest
    container_name: veribrand-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - VERIBRAND_BOOTSTRAP_TOKEN=${VERIBRAND_BOOTSTRAP_TOKEN:-}
      - PYTHON_ENGINE_URL=http://python-verifier:8000
      - VERIBRAND_PYTHON_API_KEY=${VERIBRAND_PYTHON_API_KEY:-}
      - DATABASE_URL=postgresql://veribrand:${POSTGRES_PASSWORD:-veribrand_secure_password_2026}@postgres:5432/veribrand
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      python-verifier:
        condition: service_healthy

  python-verifier:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: veribrand-python:latest
    container_name: veribrand-python
    restart: unless-stopped
    working_dir: /app
    environment:
      - VERIBRAND_PYTHON_HOST=0.0.0.0
      - VERIBRAND_PYTHON_PORT=8000
      - VERIBRAND_PYTHON_API_KEY=${VERIBRAND_PYTHON_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  postgres:
    profiles: ["postgres-tools"]
    image: postgres:16-alpine
    container_name: veribrand-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=veribrand
      - POSTGRES_USER=veribrand
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veribrand -d veribrand"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
